<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>摸一会儿</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;overflow-x:hidden}
.page{display:none;min-height:100vh;padding:20px}
.page.active{display:block}

/* 入口页 */
#entry-page{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100vh}
#entry-page h1{font-size:36px;margin-bottom:16px;letter-spacing:2px}
#entry-page .sub{color:#94a3b8;font-size:14px;margin-bottom:8px}
#entry-page .online{color:#38bdf8;font-size:20px;margin:24px 0}
#entry-page .online span{font-weight:bold;font-size:28px}
#entry-page button{margin-top:24px;padding:14px 48px;font-size:18px;border:none;border-radius:12px;background:#38bdf8;color:#0f172a;font-weight:bold;cursor:pointer}
#entry-page button:active{transform:scale(0.97)}
#entry-page .hint{color:#64748b;font-size:12px;margin-top:24px;line-height:1.8}

/* 鱼塘页 */
#pond-page{padding:0;display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1e293b;font-size:13px;flex-shrink:0}
.topbar span{color:#94a3b8}
.topbar span b{color:#e2e8f0}
.topbar button{padding:6px 12px;font-size:12px;border:1px solid #475569;border-radius:8px;background:transparent;color:#94a3b8;cursor:pointer}
#bubble-area{flex:1;position:relative;overflow:hidden;background:#0f172a}
.bubble{position:absolute;padding:10px 14px;border-radius:16px;background:#1e293b;border:1px solid #334155;font-size:13px;cursor:pointer;transition:transform .2s,box-shadow .2s;white-space:nowrap;animation:float 3s ease-in-out infinite}
.bubble:active{transform:scale(0.95)}
.bubble .ws{color:#38bdf8;font-weight:bold}
.bubble .st{color:#94a3b8;margin-left:6px}
.bubble.ai{border-style:dashed;opacity:0.7}
.bubble.ai .ws{color:#a78bfa}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bottombar{padding:10px 14px;background:#1e293b;flex-shrink:0}
.status-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.status-btn{padding:6px 10px;font-size:12px;border:1px solid #475569;border-radius:8px;background:transparent;color:#94a3b8;cursor:pointer}
.status-btn.active{background:#38bdf8;color:#0f172a;border-color:#38bdf8}
.timer-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#94a3b8}
.timer-row button{padding:6px 12px;font-size:12px;border:none;border-radius:8px;background:#38bdf8;color:#0f172a;font-weight:bold;cursor:pointer}

/* 伪装页 */
#boss-page{background:#f8fafc;color:#1e293b;padding:0}
.boss-header{padding:12px 20px;background:#fff;border-bottom:1px solid #e2e8f0;font-size:16px;font-weight:bold}
.boss-content{padding:20px}
.boss-chart{height:200px;background:linear-gradient(135deg,#e0f2fe,#bae6fd);border-radius:8px;margin-bottom:16px;position:relative;overflow:hidden}
.boss-chart::after{content:"";position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(to top,rgba(56,189,248,0.3),transparent);clip-path:polygon(0 100%,10% 70%,25% 80%,40% 40%,55% 55%,70% 20%,85% 35%,100% 10%,100% 100%)}
.boss-table table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
.boss-table th,.boss-table td{padding:10px 14px;text-align:left;font-size:13px;border-bottom:1px solid #f1f5f9}
.boss-table th{background:#f8fafc;color:#64748b;font-weight:normal}
.boss-hint{position:fixed;bottom:12px;right:16px;font-size:12px;color:#94a3b8}

/* 警告弹窗 */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:100}
.modal.active{display:flex}
.modal-content{background:#1e293b;border-radius:16px;padding:20px;width:80%;max-width:320px}
.modal-content h3{font-size:15px;margin-bottom:14px;color:#e2e8f0}
.modal-content button{display:block;width:100%;padding:12px;margin-bottom:8px;font-size:14px;border:1px solid #334155;border-radius:10px;background:transparent;color:#e2e8f0;cursor:pointer}
.modal-content button:active{background:#334155}
.modal-content button:last-child{margin-bottom:0;color:#94a3b8;border-color:transparent}

/* 弹幕 */
#danmaku{position:fixed;top:0;left:0;right:0;z-index:200;pointer-events:none}
.danmaku-item{padding:10px 16px;background:#ef4444;color:#fff;font-size:13px;text-align:center;animation:slideDown 3s ease forwards}
@keyframes slideDown{0%{transform:translateY(-100%);opacity:0}10%{transform:translateY(0);opacity:1}80%{transform:translateY(0);opacity:1}100%{transform:translateY(-100%);opacity:0}}
</style>
</head>
<body>

<!-- 入口页 -->
<div id="entry-page" class="page active">
  <h1>摸一会儿</h1>
  <p class="sub">上班无聊时，看看别人也在摸鱼</p>
  <p class="online">当前 <span id="entry-online">--</span> 个打工人正在摸鱼</p>
  <button onclick="enterPond()">开始摸鱼</button>
  <p class="hint">无需注册 · 匿名进入 · 随时关闭<br>按 Esc 可秒切工作页面</p>
</div>

<!-- 鱼塘页 -->
<div id="pond-page" class="page">
  <div class="topbar">
    <span>在线 <b id="online-count">0</b></span>
    <span>我是 <b id="my-workstation">---</b></span>
    <button onclick="toggleBossMode()">老板键 Esc</button>
  </div>
  <div id="bubble-area"></div>
  <div class="bottombar">
    <div class="status-row" id="status-row">
      <button class="status-btn active" data-status="发呆">发呆</button>
      <button class="status-btn" data-status="刷帖">刷帖</button>
      <button class="status-btn" data-status="带薪拉屎">带薪拉屎</button>
      <button class="status-btn" data-status="等下班">等下班</button>
      <button class="status-btn" data-status="假装工作">假装工作</button>
    </div>
    <div class="timer-row">
      <span>摸鱼计时：<b id="timer">00:00:00</b></span>
      <button onclick="share()">分享摸鱼身份证</button>
    </div>
  </div>
</div>

<!-- 伪装页 -->
<div id="boss-page" class="page">
  <div class="boss-header">Q3 经营数据看板</div>
  <div class="boss-content">
    <div class="boss-chart"></div>
    <div class="boss-table">
      <table>
        <tr><th>部门</th><th>收入</th><th>同比</th></tr>
        <tr><td>华东</td><td>1,234 万</td><td>+12.3%</td></tr>
        <tr><td>华南</td><td>987 万</td><td>+8.7%</td></tr>
        <tr><td>华北</td><td>765 万</td><td>+5.2%</td></tr>
        <tr><td>西南</td><td>543 万</td><td>+3.1%</td></tr>
      </table>
    </div>
  </div>
  <p class="boss-hint">按 Esc 返回</p>
</div>

<!-- 警告弹窗 -->
<div id="warning-modal" class="modal">
  <div class="modal-content">
    <h3>警告 <span id="warning-target"></span></h3>
    <button onclick="sendWarning('老板来了！')">老板来了！</button>
    <button onclick="sendWarning('抓到你了！')">抓到你了！</button>
    <button onclick="sendWarning('不许摸鱼！')">不许摸鱼！</button>
    <button onclick="sendWarning('你工位号我记下了')">你工位号我记下了</button>
    <button onclick="closeWarningModal()">取消</button>
  </div>
</div>

<!-- 弹幕 -->
<div id="danmaku"></div>

<script>
// ============ 配置（部署后替换这两个值）============
const SUPABASE_URL = 'https://gtlefqsqjpuazsaafep.supabase.co';
const SUPABASE_ANON_KEY = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0bGVmZnFzanFwdWF6c2FhcGVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NDM4NzUsImV4cCI6MjEwNTExOTg3NX0.CqIi9s1FIAZUnZa6ga5o1DVq5ICSA3SshkEeCfiQi2Q;
// =================================================

const { createClient } = supabase;
let client, channel;
let myWorkstation = '';
let myStatus = '发呆';
let onlineUsers = [];
let aiUsers = [];
let timerInterval = null;
let seconds = 0;
let bossMode = false;
let warningTarget = '';
let lastWarningTime = 0;

// 生成随机工位号
function genWorkstation() {
  const letters = 'ABCDEFGH';
  const l = letters[Math.floor(Math.random() * letters.length)];
  const n = String(Math.floor(Math.random() * 9000) + 1000);
  return '工位 ' + l + n;
}

// 入口页显示在线人数
async function showEntryOnline() {
  try {
    const c = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const ch = c.channel('lobby');
    ch.subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        const state = ch.presenceState();
        const count = Object.values(state).flat().length;
        document.getElementById('entry-online').textContent = count || '--';
      }
    });
  } catch(e) {
    document.getElementById('entry-online').textContent = '--';
  }
}

// 进入鱼塘
async function enterPond() {
  // 生成或复用身份
  myWorkstation = localStorage.getItem('my_ws') || genWorkstation();
  localStorage.setItem('my_ws', myWorkstation);
  document.getElementById('my-workstation').textContent = myWorkstation;

  // 切换页面
  document.getElementById('entry-page').classList.remove('active');
  document.getElementById('pond-page').classList.add('active');

  // 连接 Supabase
  client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  channel = client.channel('pond', {
    config: { presence: { key: myWorkstation } }
  });

  channel
    .on('presence', { event: 'sync' }, () => {
      const state = channel.presenceState();
      onlineUsers = Object.values(state).flat();
      updateOnlineList();
    })
    .on('broadcast', { event: 'warning' }, ({ payload }) => {
      if (payload.to === myWorkstation) {
        showDanmaku(payload.from + ' 警告你：' + payload.type);
      }
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await channel.track({
          workstation: myWorkstation,
          status: myStatus,
          is_ai: false,
          joined_at: Date.now()
        });
      }
    });

  // 状态按钮
  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      myStatus = btn.dataset.status;
      if (channel) channel.track({ workstation: myWorkstation, status: myStatus, is_ai: false, joined_at: Date.now() });
      updateOnlineList();
    };
  });

  // 计时器
  timerInterval = setInterval(() => {
    seconds++;
    const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    document.getElementById('timer').textContent = h + ':' + m + ':' + s;
  }, 1000);
}

// 更新在线列表
function updateOnlineList() {
  const realUsers = onlineUsers.filter(u => !u.is_ai);
  const count = realUsers.length;
  document.getElementById('online-count').textContent = count;

  // 人少时生成 AI 工位
  if (count < 3) {
    aiUsers = [
      { workstation: 'AI 工位 A001', status: pickStatus(), is_ai: true },
      { workstation: 'AI 工位 B002', status: pickStatus(), is_ai: true }
    ];
  } else {
    aiUsers = [];
  }

  renderBubbles();
}

function pickStatus() {
  const arr = ['发呆', '刷帖', '带薪拉屎', '等下班', '假装工作'];
  return arr[Math.floor(Math.random() * arr.length)];
}

// 渲染气泡
function renderBubbles() {
  const area = document.getElementById('bubble-area');
  area.innerHTML = '';
  const all = [...onlineUsers.filter(u => u.workstation !== myWorkstation), ...aiUsers];
  const areaW = area.clientWidth || window.innerWidth;
  const areaH = area.clientHeight || window.innerHeight - 160;

  all.forEach((u, i) => {
    const b = document.createElement('div');
    b.className = 'bubble' + (u.is_ai ? ' ai' : '');
    b.innerHTML = '<span class="ws">' + u.workstation + '</span><span class="st">' + (u.status || '摸鱼中') + '</span>';
    b.style.left = Math.random() * (areaW - 180) + 'px';
    b.style.top = Math.random() * (areaH - 50) + 'px';
    b.style.animationDelay = (Math.random() * 3) + 's';
    if (!u.is_ai) {
      b.onclick = () => openWarningModal(u.workstation);
    }
    area.appendChild(b);
  });
}

// 打开警告弹窗
function openWarningModal(target) {
  warningTarget = target;
  document.getElementById('warning-target').textContent = target;
  document.getElementById('warning-modal').classList.add('active');
}

function closeWarningModal() {
  document.getElementById('warning-modal').classList.remove('active');
}

// 发送警告
function sendWarning(type) {
  const now = Date.now();
  if (now - lastWarningTime < 10000) {
    showDanmaku('慢一点，10 秒后才能再警告');
    closeWarningModal();
    return;
  }
  lastWarningTime = now;
  if (channel) {
    channel.send({
      type: 'broadcast',
      event: 'warning',
      payload: { from: myWorkstation, to: warningTarget, type: type }
    });
  }
  showDanmaku('已警告 ' + warningTarget + '：' + type);
  closeWarningModal();
}

// 弹幕
function showDanmaku(text) {
  const d = document.getElementById('danmaku');
  const item = document.createElement('div');
  item.className = 'danmaku-item';
  item.textContent = text;
  d.appendChild(item);
  setTimeout(() => item.remove(), 3000);
}

// 老板键
function toggleBossMode() {
  bossMode = !bossMode;
  const pond = document.getElementById('pond-page');
  const boss = document.getElementById('boss-page');
  const favicon = document.getElementById('favicon');
  if (bossMode) {
    pond.classList.remove('active');
    boss.classList.add('active');
    document.title = 'Q3 经营数据看板';
    favicon.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>";
  } else {
    boss.classList.remove('active');
    pond.classList.add('active');
    document.title = '摸一会儿';
    favicon.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>";
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') toggleBossMode();
});

// 分享
function share() {
  const text = '我是 ' + myWorkstation + '，今日摸鱼 ' + Math.floor(seconds / 60) + ' 分钟。当前 ' + onlineUsers.length + ' 个打工人正在摸鱼，你的工位被点名了！';
  if (navigator.share) {
    navigator.share({ title: '摸一会儿', text: text, url: location.href });
  } else {
    navigator.clipboard.writeText(text + ' ' + location.href).then(() => {
      showDanmaku('分享文案已复制');
    }).catch(() => {
      showDanmaku(text);
    });
  }
}

// 初始化
showEntryOnline();
window.addEventListener('resize', () => { if (channel) renderBubbles(); });
</script>
</body>
</html>
